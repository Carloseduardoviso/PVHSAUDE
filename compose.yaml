services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    restart: unless-stopped
    environment:
      Api__BaseUrl: http://api:8080/
    depends_on:
      api:
        condition: service_healthy
    networks:
      edge:
        ipv4_address: 172.28.0.3
      backend:
        ipv4_address: 172.29.0.3
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=PVHSAUDE;User Id=pvhsaude_app;Password=${PVHSAUDE_APP_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Jwt__SecretKey: ${Jwt__SecretKey}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
    volumes:
      - api_uploads:/app/wwwroot/uploads
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks:
      backend:
        ipv4_address: 172.29.0.4
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
      - sqlserver_backups:/var/opt/mssql/backups
    networks:
      backend:
        ipv4_address: 172.29.0.2
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  db-bootstrap:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: "no"
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      PVHSAUDE_APP_PASSWORD: ${PVHSAUDE_APP_PASSWORD}
      PVHSAUDE_MIGRATOR_PASSWORD: ${PVHSAUDE_MIGRATOR_PASSWORD}
    volumes:
      - ./scripts/bootstrap-db.sql:/scripts/bootstrap-db.sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - backend
    command:
      - /bin/bash
      - -c
      - >-
        /opt/mssql-tools18/bin/sqlcmd -C -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" -b
        -i /scripts/bootstrap-db.sql
        -v AppPassword="$$PVHSAUDE_APP_PASSWORD" MigratorPassword="$$PVHSAUDE_MIGRATOR_PASSWORD"

  migrator:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
      target: migrator
    restart: "no"
    environment:
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=PVHSAUDE;User Id=pvhsaude_migrator;Password=${PVHSAUDE_MIGRATOR_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Jwt__SecretKey: ${Jwt__SecretKey}
      Jwt__Issuer: ${Jwt__Issuer}
      Jwt__Audience: ${Jwt__Audience}
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    networks:
      - backend
    command:
      - database
      - update
      - --project
      - src/Infra/Infra.Data/PVHSAUDE.Infra.Data.csproj
      - --startup-project
      - src/Api/PVHSAUDE.Api.csproj

networks:
  edge:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  backend:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  caddy_data:
  caddy_config:
  sqlserver_data:
  sqlserver_backups:
  api_uploads:
